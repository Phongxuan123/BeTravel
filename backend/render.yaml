services:
  - type: web
    name: betravel-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Bí mật (MONGODB_URI, JWT_ACCESS_SECRET, GEMINI_API_KEY, SMTP_*...)
      # KHÔNG khai giá trị ở đây -- đặt trực tiếp trên Render Dashboard
      # (Environment tab), xem docs/DEPLOY.md.
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_TRANSPORT
        value: body
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
